name: Android APK

# 只在动了 Android 壳或看板本体时构建，避免每次改文档都跑一轮
on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
      - 'workbuddy-token.html'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
      - 'workbuddy-token.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: 构建并签名 Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK 命令行工具
        uses: android-actions/setup-android@v3

      - name: 准备 SDK 组件
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: 安装 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 密钥只从 Secrets 来，仓库里不落盘、不入库。
      # 通过 env 传入而不是拼进命令行，避免密钥出现在脚本正文里。
      - name: 解码签名密钥
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::warning::未配置 KEYSTORE_BASE64，本次构建将不使用发布签名"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/sign"
          printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/sign/release.keystore"
          echo "密钥已就绪：$(stat -c%s "$RUNNER_TEMP/sign/release.keystore") 字节"

      - name: 构建 Release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/sign/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ ! -f "$KEYSTORE_PATH" ]; then
            unset KEYSTORE_PATH
            echo "未提供密钥，产出未签名的 Release 包"
          fi
          gradle -p android assembleRelease --no-daemon --stacktrace

      - name: 校验签名
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -n1)
          echo "产物：$APK（$(stat -c%s "$APK") 字节）"
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -n1)
          "$BT/apksigner" verify --print-certs "$APK" \
            || echo "::warning::该 APK 未签名（未配置签名密钥）"

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: buddyToken-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
