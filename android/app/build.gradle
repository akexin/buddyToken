plugins {
    id 'com.android.application'
}

// 看板本体（workbuddy-token.html）只在仓库根维护一份，构建时拷进 assets，
// 不在 android/ 下再存一个副本——否则两边会漂移。
def repoRoot = rootProject.projectDir.parentFile

android {
    namespace 'cn.akexin.buddytoken'
    compileSdk 34

    defaultConfig {
        applicationId "cn.akexin.buddytoken"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    // 签名参数全部来自环境变量：CI 里由工作流从 Secrets 解码后注入，
    // 本地构建时不设这些变量就自动跳过，退化成 debug 签名。
    signingConfigs {
        release {
            def ksPath = System.getenv("KEYSTORE_PATH")
            if (ksPath) {
                storeFile file(ksPath)
                storeType "PKCS12"
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (System.getenv("KEYSTORE_PATH")) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // 生成的看板资源目录（见 copyDashboard）
    sourceSets.main.assets.srcDirs += layout.buildDirectory.dir('generated/dashboard').get().asFile

    lint {
        // lint 只作参考，不因告警中断发布构建
        abortOnError false
    }
}

// 把仓库根的看板拷成 assets/index.html
tasks.register('copyDashboard', Copy) {
    from(repoRoot) {
        include 'workbuddy-token.html'
        rename { 'index.html' }
    }
    into(layout.buildDirectory.dir('generated/dashboard'))
}

// 凡是会读到上面那个目录的任务，都必须先跑 copyDashboard。
// 不声明的话 Gradle 8 的隐式依赖校验会直接判定构建失败：
// 报错的任务名不止 merge*Assets，lint 的模型任务也会扫 assets。
tasks.configureEach { t ->
    def n = t.name.toLowerCase()
    if ((t.name.startsWith('merge') && t.name.endsWith('Assets')) || n.contains('lint')) {
        t.dependsOn('copyDashboard')
    }
}
